[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylon"
version = "0.1.0"
description = "Async PostgreSQL mapper build on typed Python dataclasses."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31",
    "click>=8.1",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
pylon = 'pylon.cli:cli'

[tool.hatch.build.targets.wheel]
packages = ["pylon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
