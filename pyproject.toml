[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "pylon"
version = "0.1.0"
description = "Async PostgreSQL mapper build on typed Python dataclasses."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31",
    "click>=8.4.2",
    "prompt_toolkit>=3.0.52",
    "httpx>=0.28.1"
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
pylon = 'pylon.cli:main'

[tool.maturin]
manifest-path = "crates/pylon-py/Cargo.toml"
python-packages = ["pylon"]
module-name = "pylon._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
