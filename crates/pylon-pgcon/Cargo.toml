[package]
name = "pylon-db-pgcon"
description = "PostgreSQL connection layer for Pylon: pooling, binary wire decoding, LISTEN/NOTIFY"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pylon", "postgres", "postgresql", "database", "pool"]
categories = ["database"]

[lib]
name = "pylon_pgcon"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
postgres-types = "0.2"
deadpool-postgres = "0.14"
pylon-db-value = { workspace = true }
serde_json = "1"
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
bytes = "1"
hex = "0.4"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
