[package]
name = "pylon-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
pylon-cache = { path = "../pylon-cache" }
pylon-config = { path = "../pylon-config" }
pylon-client = { path = "../pylon-client" }
pylon-core = { path = "../pylon-core" }
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-providers = { path = "../pylon-providers" }
pylon-value = { path = "../pylon-value" }
pylon-workers = { path = "../pylon-workers" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
mime_guess = "2"
toml = "0.8"
serde_json = "1"
thiserror = "2.0.19"
hex = "0.4"
# No date/time crate exists anywhere else in the workspace (Python's own
# `datetime` module does this arithmetic on the pyo3 side today) — needed
# here to render `Value::Date/Time/Timestamp/Timestamptz`'s raw PG-epoch
# integers as ISO-8601 strings for JSON responses. Naive types only, no
# "clock"/timezone-database features required.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
