[package]
name = "pylon-db-core"
description = "The Pylon compiler: PyQL parsing, IR, SQL emission, schema export and migration diffing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pylon", "pyql", "postgres", "database", "compiler"]
categories = ["database", "parser-implementations"]

[lib]
name = "pylon_core"

[dependencies]
thiserror = "2.0.18"
lru = "0.18"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pylon-db-pgcon = { workspace = true }
pylon-db-value = { workspace = true }
tokio-postgres = "0.7"
strsim = "0.11.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
