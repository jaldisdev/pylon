[package]
name = "pylon-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.18"
lru = "0.18"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-value = { path = "../pylon-value" }
tokio-postgres = "0.7"
strsim = "0.11.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
