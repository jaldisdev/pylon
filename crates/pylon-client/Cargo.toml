[package]
name = "pylon-client"
version = "0.1.0"
edition.workspace = true

[dependencies]
pylon-cache = { path = "../pylon-cache" }
pylon-core = { path = "../pylon-core" }
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-value = { path = "../pylon-value" }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
thiserror = "2.0.19"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
