[package]
name = "pylon-client"
version = "0.1.0"
edition.workspace = true

[dependencies]
pylon-cache = { path = "../pylon-cache" }
pylon-core = { path = "../pylon-core" }
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-value = { path = "../pylon-value" }
pylon-derive = { path = "../pylon-derive" }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = "1"
serde_json = "1"
thiserror = "2.0.19"
uuid = "1"
# Parses the text form of a `date`/`time`/`timestamp` NOTIFY payload into
# the PG-epoch-relative integers `Value` stores (`listen::decode_scalar_text`),
# and converts those same integers to and from `chrono` types for
# `Queryable`/`QueryArg`.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
