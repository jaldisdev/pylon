[package]
name = "pylon-db-client"
description = "Native Rust client for Pylon: run PyQL queries against a Pylon-managed PostgreSQL database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["pylon", "pyql", "postgres", "postgresql", "database"]
categories = ["database"]

[lib]
name = "pylon_client"

[dependencies]
pylon-db-cache = { workspace = true }
pylon-db-core = { workspace = true }
pylon-db-pgcon = { workspace = true }
pylon-db-value = { workspace = true }
pylon-db-derive = { workspace = true }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = "1"
serde_json = "1"
thiserror = "2.0.19"
uuid = "1"
# Parses the text form of a `date`/`time`/`timestamp` NOTIFY payload into
# the PG-epoch-relative integers `Value` stores (`listen::decode_scalar_text`),
# and converts those same integers to and from `chrono` types for
# `Queryable`/`QueryArg`.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
