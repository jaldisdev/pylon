[package]
name = "pylon-workers"
version = "0.1.0"
edition.workspace = true

[dependencies]
pylon-core = { path = "../pylon-core" }
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-cache = { path = "../pylon-cache" }
pylon-providers = { path = "../pylon-providers" }
pylon-value = { path = "../pylon-value" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
hex = "0.4"
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
wiremock = "0.6"
