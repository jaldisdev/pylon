[package]
name = "pylon-py"
version = "0.1.0"
edition.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pylon-core = { path = "../pylon-core" }
pylon-cache = { path = "../pylon-cache" }
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-value = { path = "../pylon-value" }
pylon-providers = { path = "../pylon-providers" }
pylon-workers = { path = "../pylon-workers" }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde_json = "1.0.150"
