[package]
name = "pylon-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pylon-db-core = { workspace = true }
pylon-db-client = { workspace = true }
pylon-db-cache = { workspace = true }
pylon-db-pgcon = { workspace = true }
pylon-db-value = { workspace = true }
pylon-providers = { path = "../pylon-providers" }
pylon-workers = { path = "../pylon-workers" }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde_json = "1.0.150"
