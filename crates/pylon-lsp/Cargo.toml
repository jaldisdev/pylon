[package]
name = "pylon-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pylon-lsp"
path = "src/main.rs"

[dependencies]
pylon-db-core = { workspace = true }
pylon-db-pgcon = { workspace = true }
pylon-config = { path = "../pylon-config" }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
