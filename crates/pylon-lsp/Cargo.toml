[package]
name = "pylon-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pylon-lsp"
path = "src/main.rs"

[dependencies]
pylon-core = { path = "../pylon-core" }
pylon-pgcon = { path = "../pylon-pgcon" }
pylon-server = { path = "../pylon-server" }
lsp-server = "0.9"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
