name: Release

# Wheels carry a compiled extension, so there is one per platform rather than
# one pure-Python wheel for everything. The build matrix is what makes a
# release take a while; it runs only on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build and keep the artefacts)"
        type: boolean
        default: false
      publish_crates:
        description: "Publish to crates.io"
        type: boolean
        default: false
      crates:
        description: "Which crates to publish, e.g. '-p pylon-db-core -p pylon-db-client'. Empty publishes the whole workspace."
        type: string
        default: ""
      publish_image:
        description: "Publish the pylon-server image to GHCR"
        type: boolean
        default: false
      pylon_ui_ref:
        description: "Ref of jaldisdev/pylon-ui to embed in the image"
        type: string
        default: canary

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.runner }} ${{ matrix.platform.target }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # pylon-py reads calendar components straight off CPython's datetime
        # C struct, which the stable ABI does not expose, so the extension is
        # not abi3 and every supported interpreter needs its own wheel. A new
        # Python release means adding it here, same as in test.yml.
        python-version: ["3.13", "3.14"]
        platform:
          - runner: ubuntu-26.04
            target: x86_64
          - runner: ubuntu-26.04-arm
            target: aarch64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable

      # aws-lc-sys, which reqwest's rustls pulls in, assembles by hand on
      # Windows and the runner image carries no assembler for it.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The Linux build runs inside the manylinux container and so cannot
          # see the interpreter set up above; it is told which of the
          # container's own to build against. Everywhere else maturin uses the
          # single Python on PATH.
          args: >-
            --release --locked --out dist
            ${{ runner.os == 'Linux' && format('--interpreter {0}', matrix.python-version) || '' }}
          # manylinux containers are what make a Linux wheel installable
          # somewhere other than the runner that built it. 2_28 rather than
          # the default: its CentOS 7 base has no `cmake` package on aarch64,
          # only on x86_64. The glibc floor this sets, 2.28, is older than any
          # distro that can run the Python this package requires.
          manylinux: "2_28"
          # aws-lc-sys, which reqwest's rustls pulls in, drives cmake, and no
          # manylinux image ships one.
          before-script-linux: yum install -y cmake perl

      - name: Check the wheel is installable and carries its licence
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/pylon_db-*.whl
          python -m zipfile -l dist/pylon_db-*.whl | grep -i LICENSE

          # Imported from somewhere else on purpose. The checkout has a `pylon`
          # directory at its root, which Python puts ahead of site-packages, so
          # running this here would import the source tree rather than the
          # wheel just installed — and the source tree has no compiled
          # extension, because it is only ever built into the wheel.
          cd "$RUNNER_TEMP"
          python -c "import importlib.metadata as m; print('pylon-db', m.version('pylon-db'))"
          python -c "import pylon; print(pylon.__file__)"
          python -c "import pylon._core; print('compiled core ok')"
          python -c "from pylon.cli import main; print('cli entrypoint ok')"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Wheels cover the four platforms above and nothing else, so without an
      # sdist there is no install at all on anything they miss, and nothing
      # for a distribution that packages from source.
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: Publish pylon-db to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies the workflow rather than a token
      # somebody has to store and rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    name: Publish the Rust crates to crates.io
    # Deliberately not `needs: [wheels, sdist]`. A crates.io release shares
    # nothing with the eight maturin builds but the tag, so a manylinux
    # hiccup shouldn't hold it up; the two publish jobs fail and re-run
    # independently.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_crates
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing, as for PyPI above: crates.io swaps this workflow's
      # OIDC identity for a short-lived registry token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `cargo publish` aborts on a version that is already on the registry
      # rather than skipping it, so a release that dies partway through —
      # crates.io rate-limits new crates — is finished by re-running this
      # workflow with the crates that are left.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ inputs.crates }}
        run: |
          if [ -n "$CRATES" ]; then
            cargo publish --locked $CRATES
          else
            cargo publish --workspace --locked
          fi

  image:
    name: pylon-server image (${{ matrix.platform.arch }})
    # No `needs`, same as `crates` above: nothing is shared but the tag.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_image
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The UI is embedded into the binary at compile time and lives in its
      # own repository, so it is checked out here and handed to the build as
      # the named context the Dockerfile copies from. It carries no tags of
      # its own, hence a branch rather than this release's tag.
      - uses: actions/checkout@v7
        with:
          repository: jaldisdev/pylon-ui
          ref: ${{ inputs.pylon_ui_ref || 'canary' }}
          path: pylon-ui

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pylon-server

      - name: Record which UI went in
        id: ui
        run: echo "sha=$(git -C pylon-ui rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # One architecture per runner, built natively. Pushed by digest only;
      # the manifest list that gives these images their tags is assembled
      # once both are up.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/pylon-server/Dockerfile
          build-contexts: pylon-ui=./pylon-ui
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.pylon.ui.revision=${{ steps.ui.outputs.sha }}
          cache-from: type=gha,scope=server-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/pylon-server,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Publish the pylon-server image
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pylon-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pylon-server
        run: |
          docker buildx imagetools create \
            $(jq -cr '.target."docker.metadata-action".tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
